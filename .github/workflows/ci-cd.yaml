name: CI/CD Pipeline
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  # -- CI Job: Test and Build --
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
     version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java21 and maven
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Run JUnits unit tests
        run: mvn -B test

      - name: Build application jar
        run: mvn -B clean package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Read version from pom.xml
        id: version
        run: |
         VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
         echo "version=$VERSION" >> $GITHUB_OUTPUT

  # --- CD Job: Deploy
  release:
    needs: test-and-build
    if: github.event_name == 'push' && startsWith(github.ref,'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path:  ./artifact

      - name: Create GitHub Release if new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ needs.test-and-build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then 
          echo "Release tag $TAG already exists. Skipping"
          exit 0
          fi
          gh release create "$GITHUB_REF_NAME" ./artifact/*.jar \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --generate-notes
